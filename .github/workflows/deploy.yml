name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target GitHub Environment and GitOps overlay (apps/<env>/)
        type: choice
        required: true
        default: prod
        options:
          - dev
          - prod

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: email-consumer-service
  GITOPS_REPO: brandon-parker-code/email-consumer-service-gitops

jobs:
  update-gitops:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      GITOPS_VALUES_PATH: apps/${{ inputs.environment }}/email-consumer-service/values.yaml
    steps:
      - name: Image tag from commit
        id: meta
        run: |
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm image exists in ACR
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          ACR_NAME="$(echo "${{ vars.ACR_LOGIN_SERVER }}" | cut -d. -f1)"
          az acr repository show --name "$ACR_NAME" --image "${IMAGE_NAME}:${TAG}"

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump image tag
        env:
          IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          VALUES="gitops/${GITOPS_VALUES_PATH}"
          yq -i ".image.repository = strenv(IMAGE) | .image.tag = strenv(TAG)" "$VALUES"
          echo "Updated ${VALUES}:"
          yq '.image' "$VALUES"

      - name: Commit and push
        working-directory: gitops
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${GITOPS_VALUES_PATH}"
          if git diff --staged --quiet; then
            echo "No GitOps change"
            exit 0
          fi
          git commit -m "release(${TARGET_ENV}): ${IMAGE_NAME}:${TAG}"
          git push
